services:
  - type: web
    name: bear-weather-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: bear-weather-db
          property: connectionString

databases:
  - name: bear-weather-db
    plan: free
