services:
  - type: web
    name: bear-weather-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false   # ← RenderのダッシュボードでSupabaseの接続文字列を手動設定する
