<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>ベアウェザー：秋田県 天気＆安全対策</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="loading">クラウドデータベースと同期中...</div>

<div id="app" style="display:none;">
  <div class="header">
    <h1>ベアウェザー：秋田県 天気＆リアルタイム安全対策</h1>
    <div class="header-date" id="current-date">----年--月--日</div>
  </div>

  <div class="dashboard">
    <div class="weather-bear-alert" id="alert-bar">
      <div class="alert-top-row">
        <div class="w-card">
          <div class="w-icon" id="weather-icon">☁️</div>
          <div class="w-info">
            <div class="w-temp" id="weather-temp">--°C</div>
            <div class="w-text" id="weather-text">読込中...</div>
          </div>
        </div>
        <div class="alert-message">
          <div class="alert-title" id="alert-title">🐻 秋田県 クマ目撃情報マップ</div>
          <div class="alert-desc" id="dynamic-alert-text">データを読み込み中です...</div>
        </div>
      </div>
      <div class="forecast-row">
        <div class="weather-forecast-title">⏳ 3時間ごとの天気予報（直近24時間）</div>
        <div class="weather-timeline" id="weather-timeline"></div>
      </div>
    </div>

    <div class="content-body">
      <div class="sidebar" id="sidebar">
        <button class="sidebar-collapse-btn" id="sidebar-toggle" title="リストの表示切替">▲</button>
        <div class="sidebar-scroll-wrapper">
          <!-- 📅 表示期間フィルター -->
          <div class="filter-box filter-box-period">
            <div class="filter-box-title">📅 表示期間</div>
            <div class="fbtn-row" id="period-filters">
              <div class="fbtn on" data-period="1">1ヶ月</div>
              <div class="fbtn" data-period="3">3ヶ月</div>
              <div class="fbtn" data-period="6">6ヶ月</div>
              <div class="fbtn" data-period="12">1年間</div>
              <div class="fbtn" data-period="all">全期間</div>
            </div>
          </div>

          <!-- 🔍 状況種別フィルター -->
          <div class="filter-box">
            <div class="filter-box-title">🔍 状況種別</div>
            <div class="fbtn-row" id="type-filters">
              <div class="fbtn on" data-t="all">🔵 すべて</div>
              <div class="fbtn" data-t="目撃">🟡 目撃・痕跡</div>
              <div class="fbtn" data-t="人身被害">🔴 人身被害</div>
            </div>
          </div>

          <div class="list-hdr" id="list-count">0件の情報</div>
          <div class="list-scroll" id="sightings-list"></div>
        </div>

        <div class="action-panel">
          <button class="btn-primary" id="btn-open-post">📝 目撃情報を投稿する</button>
        </div>
      </div>

      <button class="sidebar-edge-toggle" id="sidebar-edge-toggle" title="サイドバーの最小化/展開">‹</button>

      <div id="map">
        <div class="map-control-overlay" id="map-ui">
          <button class="map-ctrl-btn" id="btn-radar-toggle">🌧️ 雨雲レーダーを表示</button>
          <button class="map-ctrl-btn" id="btn-bear-toggle">🐻 熊マーカーを隠す</button>
          <button class="map-ctrl-btn" id="btn-gps">📍 現在地を取得</button>
          <button class="map-ctrl-btn" id="btn-alarm">💥 熊よけ爆竹</button>
          <div class="slider-container" id="radar-slider-box" style="display: none;">
            <div class="slider-label">時間: <span class="time-display" id="time-label">-</span></div>
            <input type="range" id="radar-time-slider" min="0" max="0" value="0" class="range-slider">
          </div>
        </div>

        <button class="floating-bell-btn" id="btn-floating-alarm" title="緊急爆竹炸裂">💥</button>
      </div>
    </div>
  </div>
</div>

<!-- 📝 投稿モーダル -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-window">
    <div class="modal-hdr">
      <span>クマ目撃・被害情報の投稿</span>
      <button class="modal-close" id="modal-close-btn">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-left">
        <div class="form-grp">
          <label>情報種別</label>
          <select id="f-type">
            <option value="目撃">目撃</option>
            <option value="痕跡">痕跡（足跡・フンなど）</option>
            <option value="人身被害">人身被害</option>
          </select>
        </div>
        <div class="form-grp">
          <label>市町村</label>
          <select id="f-city">
            <option value="">選択してください</option>
            <option>秋田市</option><option>能代市</option><option>横手市</option>
            <option>大館市</option><option>男鹿市</option><option>湯沢市</option>
            <option>鹿角市</option><option>由利本荘市</option><option>潟上市</option>
            <option>大仙市</option><option>北秋田市</option><option>にかほ市</option>
            <option>仙北市</option><option>小坂町</option><option>藤里町</option>
            <option>三種町</option><option>八峰町</option><option>五城目町</option>
            <option>八郎潟町</option><option>井川町</option><option>大潟村</option>
            <option>美郷町</option><option>羽後町</option><option>東成瀬村</option>
          </select>
        </div>
        <div class="form-grp">
          <label>詳細な場所（地番・目印など）</label>
          <input type="text" id="f-loc" placeholder="例）〇〇公園付近の山林">
        </div>
        <div class="form-grp">
          <label>目撃日時</label>
          <input type="datetime-local" id="f-date">
        </div>
        <div class="form-grp">
          <label>状況の詳細（任意）</label>
          <textarea id="f-note" placeholder="体長・行動・現場の様子など"></textarea>
        </div>
      </div>
      <div class="modal-right">
        <label class="mini-map-label">地図をタップして場所を指定してください</label>
        <div id="mini-map"></div>
        <div id="coord-info">場所が未選択です</div>
      </div>
    </div>
    <div class="modal-ftr">
      <button class="btn-sec" id="modal-cancel-btn">キャンセル</button>
      <button class="btn-submit" id="modal-submit-btn">サーバーに保存する</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="app.js"></script>
</body>
</html>
